h2{color:var(--n);font-size:18px;margin:0 0 12px}h3{color:var(--n);font-size:14px;margin:0 0 7px}.big{font-size:25px;font-weight:800}.muted{font-size:12px;color:var(--m)}.pill{display:inline-block;background:#e4f3f1;color:#126965;padding:4px 8px;border-radius:14px;font-size:11px;font-weight:800;margin:2px}

.bar{height:11px;background:#e7e9eb;border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--t)}
.warning{background:#fff7df;border-left:4px solid var(--g);padding:10px;border-radius:7px;font-size:12px;margin-bottom:10px}
svg{width:100%;height:220px;background:#fbfaf7;border-radius:10px}.timeline{border-left:3px solid var(--t);padding-left:14px}.event{margin:0 0 15px}.event b{color:var(--n)}

<nav id="nav"></nav><main id="app"></main>
<script>
const tabs=["Dashboard","Affordability","Savings","Credit","Timeline"];let tab=0;
let s=JSON.parse(localStorage.getItem("vahpp")||"null")||{income:4298,lennie:0,debt:2140,savings:0,monthly:1000,credit:566,goal:680,price:350000,rate:7.24,tax:2,ins:180,hoa:0,earnest:5000,closing:9000,furniture:5000,reserve:15000};
const $=id=>document.getElementById(id),money=x=>"$"+Math.round(Number(x)||0).toLocaleString();
function pay(p,r,y){let m=r/1200,n=y*12;return p*(m*Math.pow(1+m,n))/(Math.pow(1+m,n)-1)}
function house(){return pay(+s.price,+s.rate,30)+(+s.price*+s.tax/100/12)+ +s.ins+ +s.hoa}
function dti(){return (+s.debt+house())/(+s.income+ +s.lennie)*100}
function save(){localStorage.setItem("vahpp",JSON.stringify(s));render()}
function field(k,n){return '<label>'+n+'<input type="number" value="'+s[k]+'" oninput="s.'+k+'=this.value;save()"></label>'}
function dash(){let target=+s.earnest+ +s.closing+ +s.furniture+ +s.reserve, pts=[],max=1;for(let i=0;i<=10;i++){let a=+s.savings+ +s.monthly*i,b=Math.max(0,+s.debt*(1-i/10));pts.push([i,a,b]);max=Math.max(max,a,b)}let xy=v=>205-v/max*160,path=j=>pts.map((p,i)=>(i?'L':'M')+(45+i*68)+','+xy(p[j])).join('');let be=pts.findIndex(p=>p[1]>=p[2]);return '<div class="grid"><div class="card"><h3>Target Home Price</h3><div class="big">'+money(s.price)+'</div><span class="pill">VA planning</span></div><div class="card"><h3>Housing / Month</h3><div class="big">'+money(house())+'</div><div class="muted">P&I + tax + insurance + HOA</div></div><div class="card"><h3>Planning DTI</h3><div class="big">'+dti().toFixed(1)+'%</div><div class="muted">Planning target ≈ 36%</div></div><div class="card"><h3>Credit</h3><div class="big">'+s.credit+'</div><div class="muted">Goal '+s.goal+'</div></div><div class="card wide"><h2>Debt vs. Savings Break-Even</h2><svg viewBox="0 0 760 220"><path d="'+path(1)+'" fill="none" stroke="#198f8a" stroke-width="4"/><path d="'+path(2)+'" fill="none" stroke="#c9a227" stroke-width="4"/><text x="55" y="24" fill="#14736f">Savings</text><text x="650" y="24" fill="#8c7010">Debt</text></svg><div class="muted">'+(be<0?"No break-even within 10 months.":"Projected break-even: month "+be+".")+'</div></div><div class="card wide"><h2>Purchase Funds</h2><div class="big">'+money(target)+'</div><div class="bar"><div class="fill" style="width:'+Math.min(100,+s.savings/target*100)+'%"></div></div><div class="muted">'+money(s.savings)+' saved</div></div></div>'}
function afford(){return '<div class="grid"><div class="card wide"><h2>VA Affordability</h2><div class="warning">Funding fee modeled at 0% for a service-connected disability exemption scenario. Confirm with your lender/VA. VA loans generally have no monthly PMI.</div><div class="row">'+field("price","Target home price")+field("rate","Interest rate %")+field("tax","Property tax %")+field("ins","Insurance / month")+field("hoa","HOA / month")+'</div></div><div class="card"><h3>Estimated P&I</h3><div class="big">'+money(pay(+s.price,+s.rate,30))+'</div></div><div class="card"><h3>Full Housing Cost</h3><div class="big">'+money(house())+'</div></div><div class="card wide"><h2>Areas to Compare</h2><span class="pill">Hutto</span><span class="pill">Round Rock</span><span class="pill">Pflugerville</span><span class="pill">North Austin</span></div></div>'}
function savings(){return '<div class="card"><h2>Savings & Purchase Cash</h2><div class="row">'+field("savings","Current savings")+field("monthly","Monthly savings")+field("earnest","Good-faith / earnest money")+field("closing","Closing + prepaids")+field("furniture","Furniture / startup")+field("reserve","Emergency reserve")+'</div></div>'}
function credit(){return '<div class="grid"><div class="card">'+ '<h2>Credit</h2>'+field("credit","Current score")+field("goal","Goal score")+'</div><div class="card"><h2>Income & Debt</h2>'+field("income","Primary monthly income")+field("lennie","Optional Lennie income")+field("debt","Monthly non-housing debt")+'<div class="big">'+dti().toFixed(1)+'% DTI</div></div><div class="card wide"><div class="warning">Lennie can remain at $0 while in nursing school for a conservative planning scenario.</div></div></div>'}
function timeline(){return '<div class="card"><h2>Road to November 1, 2027</h2><div class="timeline"><div class="event"><b>Oct–Dec 2026</b><br>Financial cleanup.</div><div class="event"><b>Jan–Mar 2027</b><br>Credit + cash sprint.</div><div class="event"><b>Apr–May 2027</b><br>Lender preparation.</div><div class="event"><b>June 2027</b><br>VA pre-approval.</div><div class="event"><b>Jun–Jul 2027</b><br>Start shopping.</div><div class="event"><b>Aug 15, 2027</b><br><b>Contract target.</b></div><div class="event"><b>Aug–Oct 2027</b><br>Contract-to-close.</div><div class="event"><b>Nov 1, 2027</b><br><b>KEYS IN HAND.</b></div></div></div>'}
function render(){nav.innerHTML=tabs.map((x,i)=>'<button class="'+(i==tab?'on':'')+'" onclick="tab='+i+';render()">'+x+'</button>').join('');app.innerHTML=[dash,afford,savings,credit,timeline][tab]()}render();
</script></body></html>
